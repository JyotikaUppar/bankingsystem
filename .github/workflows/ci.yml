name: CI

# Trigger on push to any branch and on pull requests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ------------------------------------------------
  # 1. Automated Unit & Integration Tests + Code Coverage
  # ------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$HOME/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
      MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run tests and generate coverage
        run: ./mvnw $MAVEN_CLI_OPTS clean verify
      - name: Upload JaCoCo coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ github.sha }}
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 14

  # ------------------------------------------------
  # 2. Security Scanning: Secret & Dependency (SCA)
  # ------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "detect --verbose --redact"

  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.21.0
        with:
          scan-type: "fs"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "0"
          skip-dirs: ""
          skip-files: ""
          ignore-unfixed: false

  # ------------------------------------------------
  # 3. Build & Versioning (skip tests, produce JAR)
  # ------------------------------------------------
  build-and-version:
    name: Build & Version
    runs-on: ubuntu-latest
    needs: [test, secret-scan, dependency-scan]
    env:
      IMAGE_TAG: "1.0.${{ github.run_number }}-${{ github.sha::8 }}"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build package (skip tests)
        run: |
          echo "Computed Version Tag: $IMAGE_TAG"
          ./mvnw $MAVEN_CLI_OPTS package -DskipTests
          mv target/*.jar target/banking-system-${IMAGE_TAG}.jar
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: banking-system-${{ env.IMAGE_TAG }}
          path: target/banking-system-${{ env.IMAGE_TAG }}.jar
          retention-days: 30

  # ------------------------------------------------
  # 4. Docker Build, Security Scan & Registry Push
  # ------------------------------------------------
  docker-build-scan-publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: build-and-version
    env:
      IMAGE_TAG: "1.0.${{ github.run_number }}-${{ github.sha::8 }}"
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        if: env.REGISTRY_URL != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and tag Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            ${{ env.REGISTRY_URL }}/${{ github.repository }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_URL }}/${{ github.repository }}:latest
          push: false
      - name: Scan image with Trivy (critical/high only)
        uses: aquasecurity/trivy-action@0.21.0
        with:
          image-ref: ${{ env.REGISTRY_URL }}/${{ github.repository }}:${{ env.IMAGE_TAG }}
          severity: "HIGH,CRITICAL"
          exit-code: "0"
      - name: Push image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            ${{ env.REGISTRY_URL }}/${{ github.repository }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_URL }}/${{ github.repository }}:latest
          push: true
      - name: Conditional latest tag push (only on default branch)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          docker push ${{ env.REGISTRY_URL }}/${{ github.repository }}:latest

  # ------------------------------------------------
  # 5. Kubernetes Manifest Validation
  # ------------------------------------------------
  k8s-validate:
    name: K8s Validate
    runs-on: ubuntu-latest
    needs: docker-build-scan-publish
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.2.1/kustomize_5.2.1_linux_amd64
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/
      - name: Render manifests
        run: |
          kustomize build k8s/ > rendered-manifests.yaml
          cat rendered-manifests.yaml
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-k8s-manifests-${{ github.sha }}
          path: rendered-manifests.yaml
          retention-days: 7

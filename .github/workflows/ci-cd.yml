name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================
  # 1. Automated Unit & Integration Tests + Code Coverage
  # =============================================================
  test:
    name: Run Automated Tests & JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Tests with Maven
        run: ./mvnw clean verify -B

      - name: Upload JaCoCo Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  # =============================================================
  # 2. Security Scanning: Secret & Dependency (SCA) Scanning
  # =============================================================
  security-scan:
    name: Security & Dependency Scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Dependency Vulnerability Scanner (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy FS SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  # =============================================================
  # 3. Artifact Packaging & Versioning
  # =============================================================
  build-and-version:
    name: Package & Version Application Artifact
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Calculate Artifact Version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="1.0.${{ github.run_number }}-${SHORT_SHA}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed Version Tag: ${VERSION}"

      - name: Build Application JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -B

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banking-system-jar-${{ steps.version.outputs.tag }}
          path: target/*.jar
          retention-days: 30

  # =============================================================
  # 4. Docker Build, Container Security Scan & Image Registry Push
  # =============================================================
  docker-security-and-publish:
    name: Docker Build & Image Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-version]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build-and-version.outputs.version_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker Image Locally for Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: banking-system:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Docker Image Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'banking-system:scan-target'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Container SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Push Docker Image to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =============================================================
  # 5. Kubernetes Manifest Validation
  # =============================================================
  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [docker-security-and-publish]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/ > rendered-manifests.yaml
          cat rendered-manifests.yaml

      - name: Dry-run Validate Manifests with Kubectl
        run: |
          kubectl apply --dry-run=client -f rendered-manifests.yaml

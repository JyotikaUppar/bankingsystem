#! postgres-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: bank-management
    labels:
        com.docker.compose.project: bank_management
        com.docker.compose.service: postgres
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: bank_management
            com.docker.compose.service: postgres
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: bank_management
                com.docker.compose.service: postgres
                com.docker.compose.network.bank-network: "true"
        spec:
            restartPolicy: unless-stopped
            containers:
                - name: bank-postgres
                  image: postgres:16-alpine
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: POSTGRES_DB
                      value: "bank_db"
                    - name: POSTGRES_PASSWORD
                      value: "secureBankPassword123!"
                    - name: POSTGRES_USER
                      value: "postgres"
                  livenessProbe:
                    exec:
                        command:
                            - /bin/sh
                            - -c
                            - pg_isready -U postgres -d bank_db
                    periodSeconds: 10
                    initialDelaySeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
                  ports:
                    - name: postgres-5432
                      containerPort: 5432
                  volumeMounts:
                    - name: var-lib-postgresql-data
                      mountPath: /var/lib/postgresql/data
                    - name: docker-entrypoint-initdb-d-01-schema-sql
                      mountPath: /docker-entrypoint-initdb.d/01-schema.sql
                      readOnly: true
            volumes:
                - name: var-lib-postgresql-data
                  persistentVolumeClaim:
                    claimName: postgres-postgres-data
                - name: docker-entrypoint-initdb-d-01-schema-sql
                  hostPath:
                    path: C:\Users\jayau\Project0\bank_management\schema.sql
                  readOnly: true

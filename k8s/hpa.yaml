apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: banking-system-hpa
  namespace: banking-system
  labels:
    app.kubernetes.io/name: banking-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: banking-system-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
